name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck & build
        run: pnpm build
      - name: "Unit tests (domain: recurrence, metrics, RBAC)"
        run: pnpm --filter @kan-do/server test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kando
          POSTGRES_PASSWORD: kando
          POSTGRES_DB: kando_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kando"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kando:kando@localhost:5432/kando_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations (up)
        run: pnpm --filter @kan-do/server migrate:up
      - name: Migrations are reversible (down + up again)
        run: |
          pnpm --filter @kan-do/server migrate:down
          pnpm --filter @kan-do/server migrate:up
      - name: Integration tests (API + DB)
        run: pnpm --filter @kan-do/server test:integration

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Boot full stack
        run: |
          cp .env.example .env
          echo "SESSION_SECRET=ci-secret-$(openssl rand -hex 16)" >> .env
          docker compose up -d --build
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kan-do/e2e exec playwright install --with-deps chromium
      - name: Wait for readiness
        run: |
          # Probe the API as 127.0.0.1, not localhost: the server binds 0.0.0.0
          # (IPv4 only), while "localhost" resolves to ::1 first inside the
          # container, so the connection is refused and the loop never passes.
          # The API's /healthz and /readyz sit at the root and nginx only proxies
          # /api/, so they are NOT reachable through port 8080 — a request there
          # hits the SPA fallback and returns index.html with 200 regardless of
          # whether the API is up. Probe the proxy via /api/auth/me instead,
          # which answers 401 unauthenticated and so proves nginx -> server works.
          for i in $(seq 1 60); do
            if docker compose exec -T server wget -qO- http://127.0.0.1:3001/readyz >/dev/null 2>&1 \
              && curl -fs http://127.0.0.1:8080/ >/dev/null \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/auth/me)" = "401" ]; then
              echo "stack ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready within 120s"
          docker compose ps
          docker compose logs server
          exit 1
      - name: Smoke test (core board/card flow)
        run: pnpm --filter @kan-do/e2e test
        env:
          # same address the readiness gate proved reachable, so a green gate
          # implies the tests can reach the stack
          E2E_BASE_URL: http://127.0.0.1:8080
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
